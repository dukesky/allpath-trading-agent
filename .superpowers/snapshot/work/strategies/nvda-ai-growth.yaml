id: nvda-ai-growth
name: NVDA long-term hold - AI infrastructure play
status: draft
version: 1
authorization: confirm
thesis: 'Bullish on NVDA''s leadership in AI chips and data center hardware.

  18-24 month horizon. Analysts consensus "Strong Buy" with avg target $302.

  Key catalysts: AI infrastructure demand, OpenAI partnership, data center growth.

  Invalidation: AI chip demand deterioration, significant market share loss to competitors,

  or datacenter revenue growth <15% for two consecutive quarters.

  '
