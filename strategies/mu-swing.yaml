id: mu-swing
name: MU swing trade - AI memory volatility capture
status: draft
version: 1
authorization: confirm
thesis: 'Micron (MU) is a high-volatility AI memory play (HBM demand supercycle) with
  extreme

  price swings driven by cyclical memory dynamics and shifting AI sentiment.

  90-day range shows ~70% swing ($737.88 - $1254.81), with -41% drawdown in one month

  followed by sharp rebounds. User wants to use MU (and similar names like SK Hynix)

  as a SWING/SATELLITE position, not a long-term hold: buy fear-driven dips, sell

  euphoria-driven rallies, with strict risk control given the volatility.

  This is explicitly NOT a buy-and-hold thesis - position should be flat most of the
  time,

  only active when clear oversold/overbought signals appear.

  Invalidation: memory market enters structural oversupply / AI HBM demand collapses.

  '
position:
  ticker: MU
  target_weight: '0.08'
  target_value: null
  max_weight: '0.1'
  max_value: null
rules:
- id: entry-oversold
  type: soft
  condition: position_weight == 0 and price < 800
  action: buy $5000
  state: armed
- id: entry-deep-oversold
  type: soft
  condition: price < 750 and position_weight < 6
  action: buy $3000
  state: armed
- id: stop-loss
  type: hard
  condition: price < 685
  action: sell all
  state: armed
- id: take-profit-1
  type: soft
  condition: pnl_pct > 20
  action: sell 50%
  state: armed
- id: take-profit-2
  type: soft
  condition: pnl_pct > 35
  action: sell all
  state: armed
- id: overbought-exit
  type: soft
  condition: price > 1000 and position_weight > 0
  action: sell all
  state: armed
review:
  cadence: daily
  invalidation: AI HBM demand structurally weakens, or memory oversupply cycle begins
