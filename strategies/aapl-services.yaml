id: aapl-services
name: AAPL services growth - conservative entry
status: draft
version: 1
authorization: confirm
thesis: 'Moderate bullish on AAPL services revenue growth, 12-18 month horizon.

  User is cautious on long-term upside, waiting for significant pullback.

  Entry target: $275 area (strong support from June 2026 lows).

  Invalidation: Services revenue growth stalls (<10%) for two consecutive quarters,

  or iPhone sales decline >15% YoY.

  '
position:
  ticker: AAPL
  target_weight: '0.15'
  target_value: null
  max_weight: '0.2'
  max_value: null
rules:
- id: initial-entry
  type: soft
  condition: position_weight == 0 and price < 275
  action: buy $6000
  state: armed
- id: add-on-dip-1
  type: soft
  condition: price < 265 and position_weight < 10
  action: buy $4500
  state: armed
- id: add-on-dip-2
  type: soft
  condition: price < 255 and position_weight < 14
  action: buy $4500
  state: armed
- id: stop-loss
  type: hard
  condition: price < 245
  action: sell all
  state: armed
- id: take-profit-1
  type: soft
  condition: pnl_pct > 25
  action: sell 30%
  state: armed
- id: take-profit-2
  type: soft
  condition: pnl_pct > 50
  action: sell 30%
  state: armed
- id: earnings-spike-trim
  type: soft
  condition: price > 360 and position_weight > 8
  action: sell $3000
  state: armed
review:
  cadence: weekly
  invalidation: Services revenue growth <10% for two consecutive quarters, or iPhone
    sales decline >15% YoY
